<!doctype html><html lang="fr"><meta charset="utf-8"><title>V12 — validation des projets</title><style>body{background:#152831;color:#eee7d5;font:17px system-ui;max-width:980px;margin:40px auto;padding:20px}button,a{padding:12px;color:inherit}canvas{max-width:32%;height:auto;margin:20px}li{padding:7px}</style><h1>V12 — projets et couverture</h1><p>Test de données synthétiques, sans toucher aux projets existants.</p><button id="run">Tester un projet avec une image et un GPX</button><button id="reload">Vérifier après rechargement</button><ul id="results"></ul><a id="open" hidden>Ouvrir le projet de test</a><div><canvas id="cover" width="768" height="1024"></canvas><canvas id="page" width="1536" height="1024"></canvas></div><script type="module">
import {createProject,exportProjectFile,importProjectFile,getProject,projectMediaIds} from '../project-store.mjs?v=13';
import {importMedia,loadMedia} from '../narrative-media.mjs?v=13';
import {paintBookCover,paintBookSpread} from '../studio-art.mjs?v=12';
const out=document.getElementById('results'),log=t=>{const li=document.createElement('li');li.textContent=t;out.append(li);};
const fail=e=>log('ÉCHEC : '+e.message),check=(yes,message)=>{if(!yes)throw Error(message);log('✓ '+message);};
function draw(image){paintBookCover(document.getElementById('cover'),{title:'Traversée des Alpes',subtitle:'Août — chemins partagés',color:'#334e43'},image);paintBookSpread(document.getElementById('page'),{chapter:'Chapitre 1 — Le départ',title:'Avant le jour',text:'Les premières lueurs éclairent les arêtes. Un récit, une image, un souvenir.',caption:'Illustration importée'},image,1);}
async function restored(){const key=sessionStorage.getItem('mountain-test-project-v12');if(!key)throw Error('Lance le premier test.');const row=await getProject(key);check(row.snapshot.gpxTrack.length===2,'GPX conservé après rechargement');const image=await loadMedia(projectMediaIds(row.snapshot)[0]);check(image.naturalWidth===800,'Image conservée et décodée après rechargement');check(row.snapshot.blockSettings.chavalard.bookOpenAtStart,'Option du carnet conservée');draw(image);const a=document.getElementById('open');a.hidden=false;a.href='../?v=12&project='+row.id;a.textContent='Ouvrir le projet de test';}
document.getElementById('reload').onclick=()=>location.reload();
document.getElementById('run').onclick=async()=>{try{out.replaceChildren();const c=document.createElement('canvas');c.width=800;c.height=600;const x=c.getContext('2d');x.fillStyle='#b4c5bd';x.fillRect(0,0,800,600);x.fillStyle='#40594d';x.beginPath();x.moveTo(0,600);x.lineTo(360,90);x.lineTo(560,420);x.lineTo(690,220);x.lineTo(800,600);x.fill();x.fillStyle='#f7efd9';x.beginPath();x.moveTo(255,240);x.lineTo(360,90);x.lineTo(458,250);x.lineTo(355,215);x.fill();const blob=await new Promise(r=>c.toBlob(r,'image/png'));const media=await importMedia(blob);const row=await createProject('V12 — Voyage de démonstration',{selected:['chavalard'],gpxSource:{name:'demo.gpx',text:'<gpx/>'},gpxTrack:[{lat:46.17,lon:7.11,ele:2700},{lat:46.17869,lon:7.11312,ele:2899}],blockSettings:{chavalard:{bookOpenAtStart:true,bookCloseAtEnd:true,bookCoverTitle:'Traversée des Alpes',bookCoverImage:media,bookPages:[{chapter:'Le départ',text:'Une histoire à raconter',image:media}]}},narrativePins:[{id:'pin-test',track:'demo',block:'chavalard',lat:46.17869,lon:7.11312,image:media}]});const file=await exportProjectFile(row);check(file.size>1000,'Sauvegarde autonome avec image');const imported=await importProjectFile(file);check(imported.id!==row.id,'Import dans un projet indépendant');check(projectMediaIds(imported.snapshot)[0]!==media,'Images remappées sans collision');sessionStorage.setItem('mountain-test-project-v12',imported.id);await restored();const reg=await navigator.serviceWorker.getRegistration('../');log(reg?'✓ Application installable : service worker '+(reg.active?.state||'en préparation'):'Service worker non démarré — ouvrir d’abord l’application.');}catch(e){fail(e);}};
if(sessionStorage.getItem('mountain-test-project-v12'))restored().catch(fail);
</script></html>
