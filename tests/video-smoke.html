<!doctype html><html lang="fr"><meta charset="utf-8"><title>V13 · contrôle des vidéos</title><style>body{font:17px system-ui;background:#162831;color:#eee;padding:25px;max-width:1000px;margin:auto}button,select{padding:10px;background:#334e43;color:white;border:1px solid #a39376;border-radius:7px;margin:4px}canvas,video{display:block;width:min(100%,640px);margin:16px 0}li{margin:8px}</style>
<h1>V13 · vidéo, transitions et sauvegarde</h1><p>Vérification avec un clip synthétique rouge, vert, bleu.</p><button id="test">Vérifier le décodage et la sauvegarde</button><button id="reload">Recharger et retrouver la vidéo</button><button id="export">Tester le rendu image par image</button><select id="mode"><option value="in-out">GPX → vidéo → GPX</option><option value="out">Vidéo → GPX</option><option value="in">GPX → vidéo</option></select><button id="demo">Voir la transition</button><ul id="results"></ul><canvas id="screen" width="640" height="360"></canvas><video id="result" controls muted playsinline hidden></video>
<script type="module">
import {importVideo,seekVideo,loadVideo} from '../video-media.mjs?v=13';
import {samplePinVideo,videoScreenRect,drawVideoFrame,videoStopPlan} from '../story-video.mjs?v=13';
import {createProject,exportProjectFile,importProjectFile,getProject} from '../project-store.mjs?v=13';
import {VideoExport} from '../video-export.mjs?v=7';
const $=id=>document.getElementById(id),canvas=$('screen'),ctx=canvas.getContext('2d'),log=t=>{const e=document.createElement('li');e.textContent=t;$('results').append(e);};let key='',busy=false;
const check=(v,t)=>{if(!v)throw Error(t);log('✓ '+t);};
async function run(fn){if(busy)return;busy=true;try{await fn();}catch(e){log('ÉCHEC : '+e.message);}finally{busy=false;}}
async function restore(){const row=await getProject(sessionStorage.getItem('video-smoke-project'));if(!row)throw Error('Lance d’abord le test.');key=row.snapshot.narrativePins[0].video;const video=await loadVideo(key);check(video.duration>5.9,'Vidéo restaurée depuis le projet');return video;}
$('reload').onclick=()=>location.reload();
$('test').onclick=()=>run(async()=>{const file=await(await fetch('./fixtures/three-colors.mp4')).blob(),data=await importVideo(new File([file],'demo.mp4',{type:'video/mp4'}));key=data.id;
 for(const [time,channel] of [[.5,0],[2.5,1],[4.5,2]]){const video=await seekVideo(key,time);drawVideoFrame(ctx,video,{x:0,y:0,width:640,height:360});const pixel=ctx.getImageData(320,180,1,1).data;check(pixel[channel]>100&&pixel[(channel+1)%3]<20,`Bonne image source à ${time} s`);}
 const row=await createProject('V13 · test vidéo',{narrativePins:[{id:'pin',track:'test',block:'chavalard',lat:46,lon:7,video:key,videoDuration:6,videoStart:0,videoEnd:6,videoMode:'out'}]});const saved=await exportProjectFile(row),imported=await importProjectFile(saved);sessionStorage.setItem('video-smoke-project',imported.id);check(imported.snapshot.narrativePins[0].video!==key,'Export/import autonome de la vidéo');await restore();});
$('export').onclick=()=>run(async()=>{await restore();const exporter=new VideoExport();let count=0;const blob=await exporter.start({canvas,ext:'mp4',fps:30,duration:2,renderFrame:async({time})=>{const video=await seekVideo(key,time+1.5);drawVideoFrame(ctx,video,{x:0,y:0,width:640,height:360});count++;}});check(count===60&&blob?.size>0,'60 images encodées à leur instant prescrit');$('result').src=URL.createObjectURL(blob);$('result').hidden=false;});
$('demo').onclick=()=>run(async()=>{await restore();const pin={video:key,videoDuration:6,videoStart:0,videoEnd:6,videoMode:$('mode').value,videoTransition:2,pause:1,angle:0};const plan=videoStopPlan(pin);for(let time=0;time<=plan.total;time+=1/30){const s=samplePinVideo(pin,time),video=await seekVideo(key,s.time);ctx.fillStyle='#42626f';ctx.fillRect(0,0,640,360);ctx.fillStyle='#bbc8ba';ctx.beginPath();ctx.moveTo(20,360);ctx.lineTo(260,70);ctx.lineTo(600,360);ctx.fill();const rect=videoScreenRect({x:260,y:100},640,360,s.expand,16/9);drawVideoFrame(ctx,video,rect,s.opacity);await new Promise(r=>setTimeout(r,1000/30));}log('✓ Transition terminée');});
if(sessionStorage.getItem('video-smoke-project'))run(restore);
</script></html>
